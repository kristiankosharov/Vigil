<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone number</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#415F91}a:hover{color:#284777}
button,input{font-family:inherit}
input:focus{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F9F9FF; color: #191C20; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E2E9">
    <a href="Account.dc.html" aria-label="Back to account" style="width: 44px; height: 44px; border-radius: 22px; color: #191C20; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Phone number</span></span>
    
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 0">
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2E9">
      <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #DCFAE6; color: #085D3A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #44474E">Current number</span><span style="font-size: 15px; font-weight: 700">+[country] ••• ••• 123</span></span>
      <span style="font-size: 12px; font-weight: 700; color: #085D3A">Verified</span>
    </div>

    <h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #44474E; margin-top: 6px">New number</h2>
    <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="position: relative; height: 56px; box-sizing: border-box; border-radius: 12px; border: 1px solid #74777F; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px">
          <span style="position: absolute; top: -9px; left: 10px; padding: 0 4px; background: #F9F9FF; font-size: 12px; font-weight: 600; color: #44474E">Phone number</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span style="flex-grow: 1; font-size: 15px; color: #191C20; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">+[country] [number]</span>
        </div><span style="font-size: 12px; color: #44474E; padding-left: 16px">A 6-digit code was sent by SMS</span>
      </div>

    <div>
      <h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #44474E">Enter code</h2>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
          <span style="{{c.style}}">{{c.v}}</span>
        </sc-for>
      </div>
      <p style="margin: 10px 0 0; font-size: 13px; color: #44474E">Didn't get it? <a href="#resend" style="font-weight: 700">Resend in 0:42</a></p>
    </div>
  </div>
  <div style="padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #E2E2E9; display: flex; flex-direction: column; gap: 8px">
    <a href="Account.dc.html" style="height: 56px; border-radius: 16px; background: #415F91; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 700">Verify &amp; save</a>
    <a href="Account.dc.html" style="height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #BA1A1A; font-size: 15px; font-weight: 700">Remove phone sign-in</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const code = ['4', '8', '1', '', '', ''];
    const cells = code.map((v, i) => ({
      v,
      style: 'width: 48px; height: 56px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; background: #FFFFFF; ' +
        (i === 3 ? 'border: 2px solid #415F91' : 'border: 1px solid #74777F')
    }));
    return { cells };
  }
}
</script>
</body>
</html>
