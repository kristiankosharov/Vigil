<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminders</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#415F91}a:hover{color:#284777}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F9F9FF; color: #191C20; font-family: Manrope, system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 20px 12px 16px 20px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; flex-grow: 1">Reminders</h1>
    <a href="RemindersFilter.dc.html" aria-label="Filter reminders" style="width: 44px; height: 44px; border-radius: 22px; color: #191C20; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </a>
  </header>

  <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
    <section style="padding: 0 20px 20px">
      <h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #44474E">{{sec.title}}</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{sec.items}}" as="r" hint-placeholder-count="2">
          <li style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2E9">
            <a href="ReminderDetail.dc.html" style="display: flex; align-items: center; gap: 14px; flex-grow: 1; min-width: 0; text-decoration: none; color: #191C20">
            <span style="{{r.dateStyle}}">
              <span style="font-size: 11px; font-weight: 700; text-transform: uppercase">{{r.month}}</span>
              <span style="font-size: 20px; font-weight: 800; line-height: 1">{{r.day}}</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
              <span style="font-size: 15px; font-weight: 700">{{r.title}}</span>
              <span style="font-size: 13px; color: #44474E">{{r.doc}}</span>
              <span style="{{r.dueStyle}}">{{r.due}}</span>
            </span>
            </a>
            <button type="button" role="switch" aria-checked="{{r.on}}" aria-label="Notify me" onClick="{{r.toggle}}" style="{{r.trackStyle}}">
              <span style="{{r.knobStyle}}"></span>
            </button>
          </li>
        </sc-for>
      </ul>
    </section>
  </sc-for>

  <a href="ReminderNew.dc.html" style="text-decoration: none; position: absolute; right: 20px; bottom: 100px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; background: #415F91; color: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(16, 24, 40, 0.18)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New reminder
  </a>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FFFFFF; border-top: 1px solid #E2E2E9; display: flex; align-items: center">
    <a href="Documents.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #44474E; font-size: 12px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
      Documents
    </a>
    <a href="Reminders.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #191C20; font-size: 12px; font-weight: 700">
      <span style="width: 64px; height: 32px; border-radius: 16px; background: #D6E3FF; color: #284777; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
      Reminders
    </a>
    <a href="Account.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #44474E; font-size: 12px; font-weight: 600">
      <span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
      Account
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: {} };
  }
  renderVals() {
    const off = this.state.off;
    const groups = [
      { title: 'This week', items: [
        { id: 'nda', month: 'Oct', day: '26', title: 'Sign NDA', doc: 'NDA – [Company]', due: 'Due tomorrow', urgent: true },
        { id: 'rent', month: 'Oct', day: '30', title: 'Return signed rental agreement', doc: 'Rental agreement', due: 'In 5 days', urgent: true }
      ] },
      { title: 'Later', items: [
        { id: 'ins', month: 'Dec', day: '02', title: 'Renew car insurance', doc: 'Car insurance policy', due: 'Expires in 38 days', urgent: false },
        { id: 'pass', month: 'Mar', day: '14', title: 'Passport expiry', doc: 'Passport copy', due: 'Remind 3 months before', urgent: false }
      ] }
    ];
    const sections = groups.map((g) => ({
      title: g.title,
      items: g.items.map((r) => {
        const on = !off[r.id];
        return {
          ...r,
          on: on ? 'true' : 'false',
          toggle: () => this.setState({ off: { ...off, [r.id]: on } }),
          dateStyle: 'width: 52px; height: 56px; flex-shrink: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; ' +
            (r.urgent ? 'background: #FEF0C7; color: #93370D' : 'background: #EDEDF4; color: #44474E'),
          dueStyle: 'font-size: 12px; font-weight: 700; color: ' + (r.urgent ? '#93370D' : '#44474E'),
          trackStyle: 'position: relative; width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; cursor: pointer; padding: 0; ' +
            (on ? 'background: #415F91; border: 2px solid #415F91' : 'background: #E2E2E9; border: 2px solid #74777F'),
          knobStyle: 'position: absolute; top: 50%; transform: translateY(-50%); border-radius: 50%; ' +
            (on ? 'left: 22px; width: 24px; height: 24px; background: #FFFFFF' : 'left: 4px; width: 16px; height: 16px; background: #74777F')
        };
      })
    }));
    return { sections };
  }
}
</script>
</body>
</html>
