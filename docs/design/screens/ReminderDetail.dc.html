<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminder details</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#415F91}a:hover{color:#284777}
button,input{font-family:inherit}
input:focus{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F9F9FF; color: #191C20; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E2E9">
    <a href="Reminders.dc.html" aria-label="Back to reminders" style="width: 44px; height: 44px; border-radius: 22px; color: #191C20; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Reminder</span></span>
    <button type="button" aria-label="Delete reminder" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #191C20; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 0">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 60px; height: 64px; flex-shrink: 0; border-radius: 14px; background: #FEF0C7; color: #93370D; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase">Oct</span>
        <span style="font-size: 22px; font-weight: 800; line-height: 1">26</span>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <span style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: #D6E3FF; color: #284777; font-size: 12px; font-weight: 700">Signing deadline</span>
        <span style="font-size: 20px; font-weight: 800">Sign NDA</span>
        <span style="font-size: 13px; font-weight: 700; color: #93370D">Due tomorrow</span>
      </span>
    </div>

    <a href="Sign.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2E9; text-decoration: none; color: #191C20">
      <span style="position: relative; width: 44px; height: 56px; flex-shrink: 0; border-radius: 6px; background: #EDEDF4; border: 1px solid #E2E2E9; display: flex; align-items: center; justify-content: center; color: #44474E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        <span style="position: absolute; right: -7px; bottom: -7px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid #FFFFFF; background: #B54708; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <span style="font-size: 15px; font-weight: 700">NDA – [Company]</span>
        <span style="font-size: 13px; color: #44474E">2 pages · waiting for your signature</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#74777F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <div>
      <h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #44474E">Notify me</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.toggle}}" style="{{o.style}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 8px 0 0; font-size: 13px; color: #44474E">{{summary}}</p>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #EDEDF4; font-size: 13px; line-height: 1.4; color: #44474E">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span>Signing the document completes this reminder automatically.</span>
    </div>
  </div>
  <div style="padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #E2E2E9; display: flex; flex-direction: column; gap: 8px">
    <a href="Sign.dc.html" style="height: 56px; border-radius: 16px; background: #415F91; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Sign now</a>
    <a href="Reminders.dc.html" style="height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #415F91; font-size: 15px; font-weight: 700">Mark as done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { d30: false, d7: true, d1: true, d0: true } };
  }
  renderVals() {
    const on = this.state.on;
    const defs = [
      { id: 'd30', label: '30 days before' },
      { id: 'd7', label: '7 days before' },
      { id: 'd1', label: '1 day before' },
      { id: 'd0', label: 'On the day' }
    ];
    const options = defs.map((o) => ({
      label: o.label,
      pressed: on[o.id] ? 'true' : 'false',
      toggle: () => this.setState({ on: { ...on, [o.id]: !on[o.id] } }),
      style: 'height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 600; cursor: pointer; ' +
        (on[o.id] ? 'background: #2E3036; color: #F0F0F7; border: 1px solid #2E3036' : 'background: #FFFFFF; color: #44474E; border: 1px solid #C4C6D0')
    }));
    const count = defs.filter((o) => on[o.id]).length;
    return {
      options,
      summary: count === 0 ? 'No notifications for this reminder.' : count + (count === 1 ? ' notification' : ' notifications') + ' at 9:00 · contents stay hidden'
    };
  }
}
</script>
</body>
</html>
