<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#415F91}a:hover{color:#284777}
button,input{font-family:inherit}
input:focus{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F9F9FF; color: #191C20; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E2E9">
    <a href="SignIn.dc.html" aria-label="Back to sign in" style="width: 44px; height: 44px; border-radius: 22px; color: #191C20; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">Reset password</span></span>
    
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 24px 24px 0">
    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #44474E">Enter your account's email. We'll send a link to choose a new password.</p>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="position: relative; height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px solid #415F91; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px">
          <span style="position: absolute; top: -9px; left: 10px; padding: 0 4px; background: #F9F9FF; font-size: 12px; font-weight: 600; color: #415F91">Email</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span style="flex-grow: 1; font-size: 15px; color: #191C20; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">name@example.com</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 16px; text-align: center; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2E9">
        <span style="width: 56px; height: 56px; border-radius: 28px; background: #DCFAE6; color: #085D3A; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
        <span style="font-size: 18px; font-weight: 800">Check your email</span>
        <span style="font-size: 14px; line-height: 1.5; color: #44474E">If an account exists for this email, a reset link is on its way.</span>
      </div>
    </sc-if>
    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #D6E3FF; color: #284777; font-size: 13px; line-height: 1.4">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>Your PIN and your documents on this phone don't change when you reset the password.</span>
    </div>
  </div>
  <div style="padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #E2E2E9; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{send}}" style="width: 100%; height: 56px; border: none; border-radius: 16px; background: #415F91; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Send reset link</button></sc-if><sc-if value="{{sent}}" hint-placeholder-val="{{ false }}"><a href="SignIn.dc.html" style="height: 56px; border-radius: 16px; background: #415F91; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 700">Back to sign in</a></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = this.state.sent;
    return { sent, notSent: !sent, send: () => this.setState({ sent: true }) };
  }
}
</script>
</body>
</html>
