<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New reminder</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#415F91}a:hover{color:#284777}
button,input{font-family:inherit}
input:focus{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F9F9FF; color: #191C20; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E2E2E9">
    <a href="Reminders.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; color: #191C20; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 700">New reminder</span></span>
    
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 20px 0">
    <div>
      <h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #44474E">Document</h2>
      <button type="button" onClick="{{toggleDocs}}" aria-expanded="{{docsOpen}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2E9; text-align: left; cursor: pointer; color: #191C20">
        <span style="width: 32px; height: 42px; flex-shrink: 0; border-radius: 6px; background: #EDEDF4; color: #44474E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{docTitle}}</span><span style="font-size: 12px; color: #44474E">Tap to choose another document</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <sc-if value="{{showDocs}}" hint-placeholder-val="{{ false }}">
        <div role="listbox" style="margin-top: 6px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E2E9; overflow: hidden; box-shadow: 0 6px 16px rgba(16, 24, 40, 0.12)">
          <sc-for list="{{docs}}" as="d" hint-placeholder-count="4">
            <button type="button" role="option" aria-selected="{{d.selected}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.title}}</button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="position: relative; height: 56px; box-sizing: border-box; border-radius: 12px; border: 2px solid #415F91; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px">
          <span style="position: absolute; top: -9px; left: 10px; padding: 0 4px; background: #F9F9FF; font-size: 12px; font-weight: 600; color: #415F91">Title</span>
          <span style="flex-grow: 1; font-size: 15px; color: #191C20; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Renew car insurance</span>
        </div>
      </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="position: relative; height: 56px; box-sizing: border-box; border-radius: 12px; border: 1px solid #74777F; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 14px">
          <span style="position: absolute; top: -9px; left: 10px; padding: 0 4px; background: #F9F9FF; font-size: 12px; font-weight: 600; color: #44474E">Date</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span style="flex-grow: 1; font-size: 15px; color: #191C20; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[DD Mon YYYY]</span><span style="font-size: 13px; font-weight: 700; color: #415F91">Change</span>
        </div>
      </div>
    <div>
      <h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #44474E">Notify me</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.toggle}}" style="{{o.style}}">{{o.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 8px 0 0; font-size: 13px; color: #44474E">{{summary}}</p>
    </div>
  </div>
  <div style="padding: 14px 20px 28px; background: #FFFFFF; border-top: 1px solid #E2E2E9; display: flex; flex-direction: column; gap: 8px">
    <a href="Reminders.dc.html" style="height: 56px; border-radius: 16px; background: #415F91; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 700">Save reminder</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { doc: 'ins', open: false, on: { d30: true, d7: true, d1: false, d0: true } };
  }
  renderVals() {
    const { doc, open, on } = this.state;
    const all = [
      { id: 'rent', title: 'Rental agreement' },
      { id: 'emp', title: 'Employment contract' },
      { id: 'ins', title: 'Car insurance policy' },
      { id: 'pass', title: 'Passport copy' }
    ];
    const defs = [
      { id: 'd30', label: '30 days before' },
      { id: 'd7', label: '7 days before' },
      { id: 'd1', label: '1 day before' },
      { id: 'd0', label: 'On the day' }
    ];
    const options = defs.map((o) => ({
      label: o.label,
      pressed: on[o.id] ? 'true' : 'false',
      toggle: () => this.setState({ on: { ...on, [o.id]: !on[o.id] } }),
      style: 'height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; font-weight: 600; cursor: pointer; ' +
        (on[o.id] ? 'background: #2E3036; color: #F0F0F7; border: 1px solid #2E3036' : 'background: #FFFFFF; color: #44474E; border: 1px solid #C4C6D0')
    }));
    const count = defs.filter((o) => on[o.id]).length;
    return {
      docTitle: all.find((d) => d.id === doc).title,
      docsOpen: open ? 'true' : 'false',
      showDocs: open,
      toggleDocs: () => this.setState({ open: !open }),
      docs: all.map((d) => ({
        title: d.title,
        selected: d.id === doc ? 'true' : 'false',
        pick: () => this.setState({ doc: d.id, open: false }),
        style: 'width: 100%; min-height: 48px; padding: 0 16px; border: none; border-bottom: 1px solid #EDEDF4; text-align: left; font-size: 15px; cursor: pointer; ' +
          (d.id === doc ? 'background: #D6E3FF; color: #284777; font-weight: 700' : 'background: #FFFFFF; color: #191C20; font-weight: 500')
      })),
      options,
      summary: count === 0 ? 'No notifications. It still shows in Reminders.' : 'You\u2019ll get ' + count + (count === 1 ? ' notification' : ' notifications') + ' at 9:00.'
    };
  }
}
</script>
</body>
</html>
