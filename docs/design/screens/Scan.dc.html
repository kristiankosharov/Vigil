<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan document</title>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#AAC7FF}a:hover{color:#D6E3FF}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0C0E13; color: #E2E2E9; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px">
    <a href="Documents.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 22px; color: #E2E2E9; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 700">Scan document</span>
    <button type="button" aria-label="Toggle flash" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #E2E2E9; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
    </button>
  </header>

  <div style="position: relative; flex-grow: 1; margin: 0 16px; border-radius: 20px; background: #1D2024; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <div style="width: 236px; height: 318px; background: #E9E5DC; transform: rotate(-4deg); box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px">
      <span style="height: 10px; width: 60%; background: #B9B3A6; border-radius: 2px"></span>
      <span style="height: 6px; width: 100%; background: #CFC9BC; border-radius: 2px"></span>
      <span style="height: 6px; width: 92%; background: #CFC9BC; border-radius: 2px"></span>
      <span style="height: 6px; width: 96%; background: #CFC9BC; border-radius: 2px"></span>
      <span style="height: 6px; width: 70%; background: #CFC9BC; border-radius: 2px"></span>
      <span style="height: 6px; width: 100%; background: #CFC9BC; border-radius: 2px; margin-top: 10px"></span>
      <span style="height: 6px; width: 88%; background: #CFC9BC; border-radius: 2px"></span>
      <span style="height: 6px; width: 94%; background: #CFC9BC; border-radius: 2px"></span>
      <span style="flex-grow: 1"></span>
      <span style="height: 1px; width: 45%; background: #8C8578; align-self: flex-end"></span>
    </div>
    <div aria-hidden="true" style="position: absolute; width: 256px; height: 338px; transform: rotate(-4deg); border: 2px solid rgba(170, 199, 255, 0.9); border-radius: 4px; background: rgba(170, 199, 255, 0.12)"></div>
    <div style="position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(12, 14, 19, 0.75); font-size: 13px; font-weight: 700; white-space: nowrap">{{status}}</div>
  </div>

  <div style="display: flex; justify-content: center; align-items: center; gap: 8px; padding: 18px 24px 8px; font-size: 13px; font-weight: 600; color: #C4C6D0; text-align: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#AAC7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M12 9l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>
    Document type is detected automatically
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 32px 36px">
    <span style="position: relative; width: 52px; height: 64px; border-radius: 8px; background: #E9E5DC; border: 2px solid #E2E2E9; box-sizing: border-box">
      <span style="position: absolute; top: -10px; right: -10px; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: #AAC7FF; color: #0A305F; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{pages}}</span>
    </span>
    <button type="button" aria-label="Capture page" onClick="{{capture}}" style="width: 76px; height: 76px; border-radius: 38px; border: 4px solid #E2E2E9; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <span style="width: 60px; height: 60px; border-radius: 30px; background: #E2E2E9"></span>
    </button>
    <a href="Review.dc.html" style="height: 44px; padding: 0 18px; border-radius: 22px; background: #AAC7FF; color: #0A305F; display: flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 700">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pages: 2 };
  }
  renderVals() {
    return {
      pages: String(this.state.pages),
      status: 'Edges found · hold still to auto-capture',
      capture: () => this.setState({ pages: this.state.pages + 1 })
    };
  }
}
</script>
</body>
</html>
